name: Publish In-App Update

# ============================================================
# Pushing split APKs to releases/ publishes the newest version as the
# Farmoish POS in-app update (Firebase Remote Config); each device then
# downloads the APK for its own ABI.
#   Build: flutter build apk --release --split-per-abi
#   (one APK per ABI, each under GitHub's 100 MB file limit)
# Forced vs optional: `android_force_update` in the Firebase console.
# "Run workflow" re-publishes the newest version in releases/.
# ============================================================
on:
  push:
    branches:
      - main
    paths:
      - 'releases/**.apk'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; the version check rejects an older APK set.
concurrency:
  group: publish-in-app-update
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'farmoish-pos' }}
  APP_PACKAGE: tj.farmoish.pos
  # SHA-256 of the release signing certificate (farmoish-pos-app
  # android/app/upload-keystore.jks). Devices reject updates signed otherwise.
  RELEASE_CERT_SHA256: f5a88f425f25d69fda9a99c6def8312c589f2734e95dcc78622ae719d0da10d4
  APK_DIR: releases

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------------------------------------
      # Verifies the newest APK set (package, release key, one ABI each),
      # then points Remote Config at it. Installed apps pick it up within
      # seconds (real-time Remote Config) and show the update prompt.
      - name: Publish to Remote Config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          python .github/scripts/publish_in_app_update.py
