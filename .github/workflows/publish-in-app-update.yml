name: Publish In-App Update

# ============================================================
# Publishing a Release with an .apk asset here makes it the
# Farmoish POS in-app update: the version and download URL go to
# Firebase Remote Config, and installed apps show the update prompt.
# Version comes from the APK itself (--build-name/--build-number),
# so the file name is free-form.
# Forced vs optional: `android_force_update` in the Firebase console.
# "Run workflow" re-publishes a release (empty tag = latest).
# ============================================================
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = latest release)
        required: false

permissions:
  contents: read

# One publish at a time; the version check rejects an older APK.
concurrency:
  group: publish-in-app-update
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'farmoish-pos' }}
  APP_PACKAGE: tj.farmoish.pos
  # SHA-256 of the release signing certificate (farmoish-pos-app
  # android/app/upload-keystore.jks). Devices reject updates signed otherwise.
  RELEASE_CERT_SHA256: f5a88f425f25d69fda9a99c6def8312c589f2734e95dcc78622ae719d0da10d4

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      - name: Download APK
        env:
          GH_TOKEN:    ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi

          NAME="$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))] | last // empty')"
          if [ -z "$NAME" ]; then
            echo "Release $TAG has no .apk asset." >&2
            exit 1
          fi
          gh release download "$TAG" --pattern "$NAME" --dir "$RUNNER_TEMP"

          TAG_URI="$(jq -rn --arg v "$TAG" '$v|@uri')"
          NAME_URI="$(jq -rn --arg v "$NAME" '$v|@uri')"
          {
            echo "APK_PATH=$RUNNER_TEMP/$NAME"
            echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_URI}/${NAME_URI}"
          } >> "$GITHUB_ENV"
          echo "Release $TAG: $NAME"

      # -------------------------------------------------------
      # A wrong package or signing key can't be installed as an update;
      # catch it here instead of on the devices.
      - name: Verify APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | head -1)"
          PACKAGE="$(grep -o " name='[^']*'" <<<"$BADGING" | head -1 | cut -d"'" -f2)"
          VERSION_CODE="$(grep -o "versionCode='[^']*'" <<<"$BADGING" | head -1 | cut -d"'" -f2)"
          VERSION_NAME="$(grep -o "versionName='[^']*'" <<<"$BADGING" | head -1 | cut -d"'" -f2)"
          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK_PATH" \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"

          if [ "$PACKAGE" != "$APP_PACKAGE" ]; then
            echo "APK package is '$PACKAGE', expected '$APP_PACKAGE'." >&2
            exit 1
          fi
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "APK is not signed with the release key (got '${CERT:-none}')." >&2
            echo "Build it on a machine that has android/key.properties." >&2
            exit 1
          fi

          {
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
          } >> "$GITHUB_ENV"
          echo "APK OK: $PACKAGE $VERSION_NAME ($VERSION_CODE)"

      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------------------------------------
      # Installed apps pick the new version up within seconds
      # (real-time Remote Config) and show the update prompt.
      - name: Publish to Remote Config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is missing." >&2
            exit 1
          fi

          pip install --quiet google-auth requests
          python .github/scripts/publish_in_app_update.py
